name: rumbo
description: "Rumbo — Localizador de Puntos de Interés: GPS en tiempo real, Google Maps, distancias y geocodificación inversa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.10.0
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
